<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <style>
      .t{font-size:17px;font-weight:700;fill:#111}
      .s{font-size:13px;fill:#333}
      .k{font-size:12px;fill:#7a4b00}
      .tool{font-size:12px;fill:#444;font-style:italic}
      .l{stroke:#444;stroke-width:2;fill:none;marker-end:url(#a)}
      .fb{stroke:#b03030;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#r)}
      .fut{stroke:#888;stroke-width:2;fill:none;stroke-dasharray:4 4;marker-end:url(#g)}
    </style>
  </defs>
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="700" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111">B1 모델 파이프라인: CAD → URDF → MJCF (MuJoCo)  — week03, 박종진</text>
  <text x="700" y="60" text-anchor="middle" class="s">MuJoCo 문서 권장: "URDF에 확장 추가 → 로드해 MJCF로 저장 → 추가 정보는 include로"  (Modeling › URDF extensions)</text>

  <!-- 1 CAD -->
  <rect x="20" y="110" width="190" height="200" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="115" y="138" text-anchor="middle" class="t">① CAD · BOM</text>
  <text x="115" y="162" text-anchor="middle" class="s">TEAM A 제공 (ICD)</text>
  <text x="115" y="186" text-anchor="middle" class="s">STEP 조립품 (mm)</text>
  <text x="115" y="206" text-anchor="middle" class="s">BOM: 질량 · 구동기</text>
  <text x="115" y="226" text-anchor="middle" class="s">토크 · 감속비 · 로터관성</text>
  <text x="115" y="258" text-anchor="middle" class="k">양팔 STEP 46종/103개</text>
  <text x="115" y="276" text-anchor="middle" class="k">상판 575×472×12 mm</text>
  <text x="115" y="296" text-anchor="middle" class="k">(4주차 입력)</text>

  <!-- 2 link split -->
  <rect x="245" y="110" width="190" height="200" rx="10" fill="#fff4e0" stroke="#d68910" stroke-width="2"/>
  <text x="340" y="138" text-anchor="middle" class="t">② 링크 분할 · 물성</text>
  <text x="340" y="162" text-anchor="middle" class="tool">FreeCAD · trimesh</text>
  <text x="340" y="186" text-anchor="middle" class="s">링크별 STL (×0.001 → m)</text>
  <text x="340" y="206" text-anchor="middle" class="s">visual(세밀) / collision(hull)</text>
  <text x="340" y="226" text-anchor="middle" class="s">질량 · COM · 관성 텐서</text>
  <text x="340" y="258" text-anchor="middle" class="k">A1 inertial 필수</text>
  <text x="340" y="276" text-anchor="middle" class="k">A3 A+B ≥ C 검사</text>

  <!-- 3 URDF -->
  <rect x="470" y="110" width="210" height="200" rx="10" fill="#e8f4fd" stroke="#2471a3" stroke-width="2"/>
  <text x="575" y="138" text-anchor="middle" class="t">③ URDF</text>
  <text x="575" y="162" text-anchor="middle" class="s">link · joint · limit · inertial</text>
  <text x="575" y="182" text-anchor="middle" class="s">베이스: planar joint 1개</text>
  <text x="575" y="208" text-anchor="middle" class="s" font-family="monospace">&lt;mujoco&gt;&lt;compiler</text>
  <text x="575" y="226" text-anchor="middle" class="s" font-family="monospace">fusestatic="false"</text>
  <text x="575" y="244" text-anchor="middle" class="s" font-family="monospace">discardvisual="false"</text>
  <text x="575" y="262" text-anchor="middle" class="s" font-family="monospace">meshdir="meshes/"/&gt;</text>
  <text x="575" y="290" text-anchor="middle" class="k">원본 · 공유 포맷 (Isaac 공용)</text>

  <!-- 4 load+save -->
  <rect x="715" y="110" width="200" height="200" rx="10" fill="#eef7ee" stroke="#1e8449" stroke-width="2"/>
  <text x="815" y="138" text-anchor="middle" class="t">④ MuJoCo 로드</text>
  <text x="815" y="162" text-anchor="middle" class="tool">MjModel.from_xml_path</text>
  <text x="815" y="182" text-anchor="middle" class="tool">mj_saveLastXML</text>
  <text x="815" y="208" text-anchor="middle" class="s">→ robot.xml (자동 생성,</text>
  <text x="815" y="226" text-anchor="middle" class="s">직접 수정하지 않음)</text>
  <text x="815" y="254" text-anchor="middle" class="k">effort → actuatorfrcrange</text>
  <text x="815" y="272" text-anchor="middle" class="k">velocity 한계는 버려짐</text>
  <text x="815" y="290" text-anchor="middle" class="k">planar → slide·slide·hinge</text>

  <!-- 5 scene -->
  <rect x="950" y="110" width="210" height="200" rx="10" fill="#f4ecf7" stroke="#7d3c98" stroke-width="2"/>
  <text x="1055" y="138" text-anchor="middle" class="t">⑤ scene.xml</text>
  <text x="1055" y="162" text-anchor="middle" class="s" font-family="monospace">&lt;include robot.xml/&gt;</text>
  <text x="1055" y="186" text-anchor="middle" class="s">position(kp·kv) 팔</text>
  <text x="1055" y="206" text-anchor="middle" class="s">velocity 베이스 · armature</text>
  <text x="1055" y="226" text-anchor="middle" class="s">exclude · 센서 · 바닥 · option</text>
  <text x="1055" y="254" text-anchor="middle" class="k">default class 로 공통값</text>
  <text x="1055" y="272" text-anchor="middle" class="k">팔 2개: mjSpec attach</text>
  <text x="1055" y="290" text-anchor="middle" class="k">(prefix left_ / right_)</text>

  <!-- 6 verify -->
  <rect x="1195" y="110" width="185" height="200" rx="10" fill="#fdfefe" stroke="#17202a" stroke-width="2"/>
  <text x="1287" y="138" text-anchor="middle" class="t">⑥ 검증</text>
  <text x="1287" y="162" text-anchor="middle" class="s">이름 · 총질량</text>
  <text x="1287" y="182" text-anchor="middle" class="s">수평 중력토크</text>
  <text x="1287" y="202" text-anchor="middle" class="s">계단 응답 · 포화</text>
  <text x="1287" y="222" text-anchor="middle" class="s">뷰어: 정지 · 범위 · 충돌</text>
  <text x="1287" y="254" text-anchor="middle" class="k">2링크: 3.9731 Nm 일치</text>
  <text x="1287" y="272" text-anchor="middle" class="k">궤적 차 1.2e-14 rad</text>
  <text x="1287" y="290" text-anchor="middle" class="k">OS 51.2 % (이론 53.2)</text>

  <path class="l" d="M210,210 L243,210"/>
  <path class="l" d="M435,210 L468,210"/>
  <path class="l" d="M680,210 L713,210"/>
  <path class="l" d="M915,210 L948,210"/>
  <path class="l" d="M1160,210 L1193,210"/>

  <!-- feedback -->
  <path class="fb" d="M1287,312 L1287,370 L575,370 L575,314"/>
  <text x="935" y="364" text-anchor="middle" class="k" fill="#b03030" style="fill:#b03030">URDF 수정 → ④ 재실행 (robot.xml 재생성, scene.xml 은 그대로)</text>
  <path class="fb" d="M1287,370 L1287,400 L115,400 L115,314"/>
  <text x="700" y="394" text-anchor="middle" class="k" style="fill:#b03030">CAD · BOM 값 오류(질량 · 관성 · 관절 원점) → ICD 요청으로 TEAM A 에 회신</text>

  <!-- future Isaac -->
  <rect x="470" y="450" width="445" height="80" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="692" y="478" text-anchor="middle" class="t" style="fill:#555">실습 PC 배정 후: Isaac Sim 5.1 URDF Importer → USD</text>
  <text x="692" y="502" text-anchor="middle" class="s">같은 ③ URDF 사용 · ⑥ 중력토크 / 말단 위치를 MuJoCo 결과와 비교</text>
  <text x="692" y="520" text-anchor="middle" class="s">(USD 2링크 선행 실습 결과는 보고서 부록)</text>
  <path class="fut" d="M650,312 L650,448"/>

  <!-- legend -->
  <text x="20" y="580" class="s">체크리스트: b1/docs/procedures/mujoco-urdf-loading-checklist.md (A~F 절)   ·   실험: week03/scripts/tue_* · wed_* · thu_*   ·   주황 글씨 = 체크리스트 항목 / week03 실측 수치</text>
  <text x="20" y="604" class="s">실선 = 현재 단계(GPU 없이),  빨강 점선 = 수정 루프,  회색 점선 = 실습 PC 배정 후</text>
</svg>
